version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: test-outcome-report-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: test-outcome-report
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: changeme
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - test-outcome-report-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test-outcome-report-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://root:changeme@mongodb:27017/test-outcome-report?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - test-outcome-report-network

volumes:
  mongodb_data:
  mongodb_config:

networks:
  test-outcome-report-network:
    driver: bridge
