spring:
  application:
    name: test-outcome-report
  mongodb:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:27017}
    database: ${DB_DATABASE_NAME:test-outcome}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}
    authentication-database: ${DB_AUTHENTICATION_DATABASE:admin}
  data:
    mongodb:
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  session:
    store-type: mongodb
    mongodb:
      collection-name: sessions
    timeout: 1800 # 30 minutes in seconds

server:
  port: 8080
  servlet:
    context-path: /test-outcome
  error:
    include-message: always
    include-stacktrace: never
    whitelabel:
      enabled: false

logging:
  level:
    root: INFO
    com.eposide: DEBUG
#    org.springframework.security: DEBUG

jwt:
  secret: ${JWT_SECRET:your-super-secret-jwt-key-change-this-in-production-min-256-chars-long-xxxxxxxxxxx}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui-custom.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin}
initial:
  organization:
    name: ${INITIAL_ORGANIZATION_NAME:Default Organization}
