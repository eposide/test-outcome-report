spring:
  application:
    name: test-outcome-report
  data:
    mongodb:
      uri: mongodb://localhost:27017/test-outcome
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  session:
    store-type: mongodb
    mongodb:
      collection-name: sessions
    timeout: 1800 # 30 minutes in seconds

server:
  port: 8080
  servlet:
    context-path: /test-outcome
  error:
    include-message: always
    include-stacktrace: never
    whitelabel:
      enabled: false

logging:
  level:
    root: INFO
    com.eposide: DEBUG

jwt:
  secret: ${JWT_SECRET:your-super-secret-jwt-key-change-this-in-production-min-256-chars-long-xxxxxxxxxxx}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
      path: /swagger-ui-custom.html