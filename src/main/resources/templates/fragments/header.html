<header th:fragment="header" xmlns:th="http://www.thymeleaf.org">
    <div class="container">
        <div>
            <h1>Test Outcome Report</h1>
            <div class="subtitle">View test history and upload JUnit XML or JSON payloads</div>
        </div>
        <nav>
            <a th:href="@{/}" title="Dashboard">Dashboard</a>
            <a th:href="@{/test-history/}" title="Test History">Test History</a>
            <a th:href="@{/file-upload}" title="Upload">Upload</a>
            <a th:if="${currentUser != null and currentUser.roles.contains(T(com.eposide.testoutcomereport.domain.UserRoles).SUPER_ADMIN)}" th:href="@{/admin/organizations}" title="Admin">Admin</a>
            <div th:if="${currentUser != null}" class="user-menu" id="userMenu">
                <button type="button" class="user-menu-button" id="userMenuButton" aria-haspopup="true" aria-expanded="false" title="User menu">
                    <span class="profile-icon">👤</span>
                </button>
                <div class="user-menu-dropdown" id="userMenuDropdown">
                    <div class="user-menu-username">
                        <span th:text="${currentUser.username}">Username</span>
                    </div>
                    <a class="user-menu-item" th:href="@{/profile}" title="Profile">Profile</a>
                    <a class="user-menu-item" th:href="@{/logout}" title="Logout">Logout</a>
                </div>
            </div>
            <a th:if="${currentUser == null}" th:href="@{/login}" title="Login">Login</a>
        </nav>
    </div>
</header>
