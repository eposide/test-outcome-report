<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Results Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}" />
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main>
    <div class="container" style="margin-top: 2rem;">
        <!-- User Information -->
        <div class="card">
            <div class="card-header">
                <h2>User Profile</h2>
            </div>
            <div class="card-body">
                <div th:if="${currentUser == null}" class="alert alert-info">
                    <strong>No user information available.</strong>
                </div>

                <div th:if="${currentUser != null}">
                    <p><strong>Username:</strong> <span th:text="${currentUser.username}"></span></p>
                    <p><strong>Organisation:</strong> <span th:text="${currentUser.organizationName}"></span></p>
                    <p><strong>Roles:</strong>
                        <span th:each="role : ${currentUser.roles}" th:text="${role} + ' '"></span>
                    </p>
                </div>
            </div>
        </div>
        <div th:if="${currentUser != null}" class="card">
            <div class="card-header">
                <h1>Reset your password</h1>
            </div>

            <div th:if="${error}" class="alert alert-error">
                <strong>Error:</strong> <span th:text="${error}"></span>
            </div>

            <div th:if="${success}" class="alert alert-success">
                <strong>Success:</strong> <span th:text="${success}"></span>
            </div>

            <form method="post" th:action="@{/reset-password}">



                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>

                <button type="submit" class="btn-reset">Reset Password</button>
            </form>

        </div>
    </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>




</body>

</html>
